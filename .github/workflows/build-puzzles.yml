# Builds the puzzle store from the Lichess puzzle database (CC0).
# One-off: Actions tab -> "Build puzzle store" -> "Run workflow".
# Tick "dry run" first to see the counts without saving anything.
name: Build puzzle store

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: report counts only, save nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash # stops on an error anywhere in a pipe, not just at its end
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Downloaded to the runner's temporary folder: never part of the repo.
      - name: Download the Lichess puzzle file
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/puzzles.csv.zst" https://database.lichess.org/lichess_db_puzzle.csv.zst
          ls -l "$RUNNER_TEMP/puzzles.csv.zst"
          file "$RUNNER_TEMP/puzzles.csv.zst"
          echo "First bytes:"
          head -c 16 "$RUNNER_TEMP/puzzles.csv.zst" | od -A x -t x1z

      # zstd is the standard unpacking tool; --long=31 allows files packed with a large window.
      - name: Unpack and filter
        run: zstd -dc --long=31 "$RUNNER_TEMP/puzzles.csv.zst" | npm run build:puzzles -- --file - ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
