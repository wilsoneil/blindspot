# Builds the puzzle store from the Lichess puzzle database (CC0).
# One-off: Actions tab -> "Build puzzle store" -> "Run workflow".
# Tick "dry run" first to see the counts without saving anything.
name: Build puzzle store

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: report counts only, save nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:puzzles -- ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
