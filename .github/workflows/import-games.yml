# Imports new chess.com games and today's ratings into Supabase.
# Runs every morning by itself, and can also be started by hand:
# Actions tab -> "Import games" -> "Run workflow".
# Running daily also keeps the free Supabase project from pausing after a quiet week.
name: Import games

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC (just after 5am UK time in winter)

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:games
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
