# Imports new chess.com games and today's ratings into Supabase.
# For now it runs when started by hand: Actions tab -> "Import games" -> "Run workflow".
# Phase 4 switches on the daily schedule (the commented-out lines below).
name: Import games

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 5 * * *"   # every day at 05:17 UTC

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:games
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
